name: Pruebas Android

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validacion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Ejecutar pruebas y Android Lint
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug --continue --no-daemon
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-android
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
